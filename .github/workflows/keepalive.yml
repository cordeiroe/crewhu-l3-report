name: Keep Streamlit Awake

# Pings the public app URL on a schedule so Streamlit Community Cloud
# never hibernates it for inactivity. Secrets keep the URL/token out of code.

on:
  schedule:
    # Every 5 min. GitHub cron has a 5 min minimum and may be delayed under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          # -L follows redirects (Streamlit answers 303 before settling on 200).
          code=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "${{ secrets.APP_URL }}/?token=${{ secrets.ACCESS_TOKEN }}")
          echo "HTTP $code"
          # Any 2xx/3xx means the app served the request -> still awake.
          # Warn instead of failing so a transient blip does not spam emails.
          case "$code" in
            2*|3*) echo "App is awake (HTTP $code)" ;;
            *) echo "::warning::App responded with HTTP $code" ;;
          esac
